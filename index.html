<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://textilegroup.github.io/wendell-users/guard.js"
        data-app="dashboard" data-barra="nao"></script>
<title>Wendell Brasil Custos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap">
<style>
:root{
  --wine:#7C1B29; --wine-deep:#5E1220; --wine-soft:#A5303F;
  --bg:#F2F2F0; --card:#FFFFFF; --sunk:#F7F5F3;
  --ink:#26252A; --ink-2:#5A555C; --ink-3:#8B858E;
  --line:#E3E0DD; --line-2:#EFECE9;
  --s1:#9E2438; --s2:#B8801F; --s3:#1E6FB8; --s4:#4E7A1E;
  --wh-in:#9E2438; --wh-in-tx:#FFFFFF; --wh-out:#80705C; --wh-out-tx:#FFFFFF;
  --pos:#2C6B4F; --neg:#A33A2A;
  --chip:#F6F4F1;
  --shadow:0 1px 2px rgba(38,37,42,.06),0 1px 8px rgba(38,37,42,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
    --bg:#141316; --card:#1E1C21; --sunk:#26232A;
    --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
    --line:#332F38; --line-2:#2A272F;
    --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
    --wh-in:#C4536A; --wh-in-tx:#FFFFFF; --wh-out:#B6A084; --wh-out-tx:#241F26;
    --pos:#5FA37E; --neg:#D97A62;
    --chip:#2A272F;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --wine:#8C2334; --wine-deep:#4C0E19; --wine-soft:#C4536A;
  --bg:#141316; --card:#1E1C21; --sunk:#26232A;
  --ink:#F0EDEA; --ink-2:#B4ADB5; --ink-3:#847D88;
  --line:#332F38; --line-2:#2A272F;
  --s1:#C4536A; --s2:#B8842C; --s3:#5B92E0; --s4:#6E9430;
  --wh-in:#C4536A; --wh-in-tx:#FFFFFF; --wh-out:#B6A084; --wh-out-tx:#241F26;
  --pos:#5FA37E; --neg:#D97A62;
  --chip:#2A272F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
/* regras de classe (ex.: .fgrp{display:flex}) vencem o [hidden] do navegador */
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-size:13px; line-height:1.4; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}

/* ---------- gate ---------- */
#gate{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
  background:linear-gradient(150deg,var(--wine-deep) 0%,var(--wine) 55%,#3C0812 100%);
}
.gate-box{
  background:var(--card);border-radius:14px;padding:26px 24px 20px;width:100%;max-width:340px;
  box-shadow:0 18px 50px rgba(0,0,0,.32);text-align:center;
}
.gate-box .logo{margin:0 auto 12px;background:var(--wine);color:#fff;border-color:var(--wine-soft)}
.gate-box h2{margin:0 0 3px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.gate-box p{margin:0 0 16px;font-size:11.5px;color:var(--ink-3);letter-spacing:.02em}
.gate-box input{
  width:100%;font:inherit;font-size:14px;text-align:center;letter-spacing:.12em;
  padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);color:var(--ink);
}
.gate-box button[disabled]{opacity:.6;cursor:progress}
.gate-box button{
  width:100%;margin-top:9px;font:inherit;font-size:12.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:10px;border:0;border-radius:9px;background:var(--wine);color:#fff;cursor:pointer;
}
.gate-box button:hover{background:var(--wine-soft)}
.gate-err{margin-top:9px;font-size:11.5px;color:var(--neg);font-weight:600;min-height:16px}
#app[hidden]{display:none}

/* ---------- header ---------- */
header{
  background:linear-gradient(100deg,var(--wine-deep) 0%,var(--wine) 62%,var(--wine-deep) 100%);
  color:#fff; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
.logo{
  width:38px;height:38px;border-radius:50%;background:#fff;color:var(--wine-deep);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;
  border:2px solid rgba(255,255,255,.85);flex:none;
}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand p{margin:1px 0 0;font-size:11px;opacity:.78;letter-spacing:.02em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hdr-chip{
  border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:5px 10px;
  font-size:11.5px;font-weight:600;letter-spacing:.03em;background:rgba(255,255,255,.07);
  color:#fff;cursor:pointer;font-family:inherit;
}
.hdr-chip:hover{background:rgba(255,255,255,.16)}
.hdr-chip[disabled]{opacity:.45;cursor:progress}
.lang{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
.lang button{
  font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:5px 10px;
  border:0;background:transparent;color:rgba(255,255,255,.72);cursor:pointer;
}
.lang button[aria-pressed="true"]{background:#fff;color:var(--wine-deep)}

/* ---------- shell ---------- */
main{max-width:1560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:10px;padding:9px 14px 8px;border-bottom:2px solid var(--wine-soft);flex-wrap:wrap}
.card-hd h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--wine)}
.card-hd .sub{margin-left:auto;font-size:11px;color:var(--ink-3);letter-spacing:.02em;text-align:right}
.card-bd{padding:11px 14px 13px}

/* ---------- filters ---------- */
.frow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.fgrp{display:flex;flex-direction:column;gap:5px;min-width:0}
.fgrp>label,.fgrp>.lb{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.pills{display:flex;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.pills button{
  font:inherit;font-size:12px;font-weight:600;border:0;background:transparent;color:var(--ink-2);
  padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.pills button[aria-pressed="true"]{background:var(--wine);color:#fff}
.pills button:focus-visible,input:focus-visible,.hdr-chip:focus-visible,.ms-btn:focus-visible,
.lang button:focus-visible,th[data-sort]:focus-visible,.tab:focus-visible{outline:2px solid var(--wine-soft);outline-offset:2px}
input[type="search"]{
  font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:210px;
}
.grow{flex:1 1 210px}

/* ---------- multiselect ---------- */
.ms{position:relative;min-width:172px}
.ms-btn{
  width:100%;display:flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;text-align:left;
}
.ms-btn .lab{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .cnt{
  font-size:10px;font-weight:700;background:var(--wine);color:#fff;border-radius:20px;padding:1px 6px;flex:none;
}
.ms-btn .car{color:var(--ink-3);font-size:10px;flex:none}
.ms-pop{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:100%;max-width:280px;
  background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.18);padding:7px;
}
.ms-pop[hidden]{display:none}
.ms-act{display:flex;gap:5px;margin-bottom:6px}
.ms-act button{
  flex:1;font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:4px;border:1px solid var(--line);background:var(--chip);color:var(--ink-2);border-radius:6px;cursor:pointer;
}
.ms-act button:hover{background:var(--sunk);color:var(--ink)}
.ms-list{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.ms-list label{
  display:flex;align-items:center;gap:7px;font-size:12px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;
}
.ms-list label:hover{background:var(--sunk)}
.ms-list input{accent-color:var(--wine);margin:0}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:10px 12px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lab{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.kpi .val{font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-size:25px;font-weight:700;
  letter-spacing:-.01em;line-height:1.05;color:var(--ink)}
.kpi .val small{font-size:14px;font-weight:600;color:var(--ink-2);margin-right:.22em}
.kpi .meta{font-size:10.5px;color:var(--ink-2);margin-top:2px}
.delta{font-weight:700}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)}
.spark{display:flex;align-items:flex-end;gap:2px;height:20px;margin-top:5px}
.spark i{flex:1;background:var(--s1);opacity:.35;border-radius:2px 2px 0 0;min-height:2px}
.spark i.on{opacity:1}
.spark.c2 i{background:var(--s2)}
.spark.c3 i{background:var(--s3)}
.spark.c4 i{background:var(--s4)}

/* ---------- charts ---------- */
.two{display:grid;grid-template-columns:1.45fr 1fr;gap:12px;align-items:start}
.stackcol,.sidecol{display:flex;flex-direction:column;gap:12px}
.hdright{margin-left:auto;display:flex;align-items:center;gap:8px}
.pills.mini{padding:2px}
.pills.mini button{font-size:11px;padding:4px 9px}
.legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-2);
  margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.hatch{background-image:repeating-linear-gradient(45deg,transparent 0 2px,rgba(255,255,255,.8) 2px 4px)}

.bars{display:flex;align-items:flex-end;gap:6px;height:176px;position:relative}
.bars.short{height:142px}
.grid-lines{position:absolute;inset:16px 0 24px;pointer-events:none}
.grid-lines i.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line-2)}
.mcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative;cursor:default}
.stack{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
/* área das barras: separada do rótulo, para o tracinho de meta cair exatamente
   na mesma escala das barras */
.plot{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
  gap:2px;position:relative}
.bar{background:var(--s1);border-radius:4px 4px 0 0;min-height:2px;transition:filter .12s}
.bar.b2{background:var(--s2)}
.bar.b3{background:var(--s3)}
.bar.b3.negv{background:var(--neg)}
.bar.part{background-image:repeating-linear-gradient(45deg,transparent 0 4px,rgba(255,255,255,.45) 4px 8px)}
.mcol:hover .bar{filter:brightness(1.12)}
.mcol.cur .bar{outline:2px solid var(--wine-soft);outline-offset:1px}
.mlab{text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-2);padding-top:5px;
  border-top:1px solid var(--line);margin-top:4px;letter-spacing:.04em}
.mval{position:absolute;left:0;right:0;text-align:center;font-size:10.5px;font-weight:700;
  color:var(--ink-2);font-family:"Archivo Narrow",Archivo,sans-serif;padding-bottom:3px;
  pointer-events:none;z-index:2}
.mval.na{color:var(--ink-3);font-weight:400}

.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:40px 1fr auto auto;align-items:center;gap:9px;font-size:12px}
.hb .uf{font-weight:700;letter-spacing:.04em;color:var(--ink)}
.hb .track{display:block;background:var(--sunk);border-radius:4px;height:15px;overflow:hidden}
.hb .fill{display:block;height:100%;background:var(--s1);border-radius:4px}
.hb .amt{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:600;color:var(--ink-2);white-space:nowrap}
.hb .pc{font-family:"Archivo Narrow",Archivo,sans-serif;font-weight:700;color:var(--ink);
  white-space:nowrap;text-align:right;min-width:46px;font-variant-numeric:tabular-nums}
.hb.semuf .uf,.hb.semuf .amt,.hb.semuf .pc{color:var(--ink-3);font-weight:500}
.hb.semuf .fill{background:var(--ink-3);opacity:.55}
/* dentro x fora do estado */
.split{display:flex;height:24px;border-radius:6px;overflow:hidden;background:var(--sunk);margin-bottom:11px}
.split span{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;
  font-family:"Archivo Narrow",Archivo,sans-serif;font-size:10.5px;font-weight:700}
.split .in{background:var(--wh-in);color:var(--wh-in-tx)}
.split .out{background:var(--wh-out);color:var(--wh-out-tx)}
.split .nou{background:var(--ink-3);opacity:.5}
.hbars.whb .hb{grid-template-columns:86px 1fr auto auto;font-size:11.5px}
.hbars.whb .hb .uf{letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .fill.in{background:var(--wh-in)}
.hb .fill.out{background:var(--wh-out)}
.hb .fill.nou{background:var(--ink-3);opacity:.55}
.dests{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.dests .dlab{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-right:2px}
.dests b{font-family:"Archivo Narrow",Archivo,sans-serif;font-size:10.5px;font-weight:600;
  background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:3px 7px;color:var(--ink-2)}
.dests b i{font-style:normal;font-weight:700;color:var(--ink);margin-left:5px}
thead th small{font-weight:600;opacity:.6;margin-left:3px;letter-spacing:.03em}
.hint{font-size:11px;color:var(--ink-3);margin-top:9px;line-height:1.45}
.tabhint{margin:0;padding:8px 14px 11px}
.tabhint:empty{display:none}

/* faixa de metas sob o grafico mensal */
.metas{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:11px;
  padding-top:10px;border-top:1px solid var(--line-2)}
.metas:empty{display:none}
.mt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mt .k{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .v{font-family:"Archivo Narrow",Archivo,sans-serif;font-size:12.5px;font-weight:700;color:var(--ink)}
.mt .v small{font-weight:500;color:var(--ink-2);font-size:11px;margin-left:5px}
.mt .v small::before{content:'· '}
.mt .tr{background:var(--sunk);border-radius:3px;height:5px;overflow:hidden}
.mt .fi{display:block;height:100%;border-radius:3px;background:var(--s1)}
.mt.ok .fi{background:var(--pos)} .mt.ok .v{color:var(--pos)}
.mt.low .fi{background:var(--neg)} .mt.low .v{color:var(--neg)}

/* marca da meta sobre a barra do mes; z-index acima das colunas */
.tgt{position:absolute;left:0;right:0;z-index:4;pointer-events:none;
  border-top:2px dashed var(--wine-soft)}
.tgt.hit{border-top-color:var(--pos)}
/* meta acima da escala: fica presa no topo, com aviso visual */
.tgt.fora{border-top-style:dotted;opacity:.6}
.legend i.ln{width:14px;height:0;border-radius:0;border-top:2px dashed var(--wine-soft)}

/* area ADM */
input.moeda{font:inherit;font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;width:100%;
  font-variant-numeric:tabular-nums;text-align:right}
input.moeda:focus{outline:2px solid var(--wine-soft);outline-offset:1px}
.admtop input.moeda{width:150px}
.admtop select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:100px}
.admgrid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:14px}
.admbloco{display:flex;flex-direction:column;gap:7px;min-width:0}
.admbloco>.lb{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.gridm{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.gridt{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mcamp{display:flex;flex-direction:column;gap:3px;min-width:0}
.mcamp label{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mcamp small{font-size:9px;color:var(--ink-3);letter-spacing:.02em}
.mcamp.tri label{color:var(--s2)}
.admcalc{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:7px 12px;
  border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink-2);cursor:pointer}
.admcalc:hover{background:var(--sunk);color:var(--ink)}
@media (max-width:1100px){.admgrid{grid-template-columns:1fr}.gridm{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.gridm{grid-template-columns:repeat(3,1fr)}.admtop input.moeda{width:100%}}
/* tela de custos (planilha simples) — so abre no modulo ADM */
#cstModal{display:block;padding:18px 18px 48px;max-width:1120px;margin:0 auto}
#cstModal[hidden]{display:none}
/* Wendell Custos: app dedicado só à Matriz de Custos — o modal abre sozinho
   e fica sem botão de fechar, já que aqui não existe painel por trás. */
#cstClose{display:none !important;}
.cst-box{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 8px 40px rgba(0,0,0,.28);width:min(1120px,100%);max-height:92vh;
  display:flex;flex-direction:column;overflow:hidden}
.cst-hd{display:flex;align-items:center;gap:10px;padding:11px 14px 10px;
  border-bottom:2px solid var(--cen);flex-wrap:wrap}
.cst-hd h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--cen)}
.cst-hd .sub{font-size:11px;color:var(--ink-3)}
.cst-acts{margin-left:auto;display:flex;gap:7px;align-items:center}
/* ===== barra dos cenarios: dois grupos visualmente separados =====
   Cada grupo (Relatorios / Lista de precos) e um bloco proprio, com o nome
   uma vez so e as duas bases dentro. Verde = o que esta valendo; vermelho =
   rascunho ainda nao aplicado. Essa cor tambem pinta a tabela inteira. */
.cst-cen{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;padding:9px 14px 0;
  background:var(--sunk);border-bottom:1px solid var(--line)}
.cen-gr{display:flex;align-items:center;gap:6px;padding:5px 12px 6px;
  border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;
  background:var(--card)}
.cen-gr + .cen-gr{margin-left:16px}
/* o bloco do grupo aberto e contornado na cor do cenario: verde quando a base
   em uso esta aberta, vermelho quando o rascunho esta aberto */
.cen-gr.ativo{border-color:var(--cen);box-shadow:inset 0 0 0 1px var(--cen);
  background:color-mix(in srgb, var(--cen) 7%, var(--card))}
.cen-gr.ativo .cen-lb{color:var(--cen)}
/* Aplicar mora colado na aba Nova a que pertence */
.cen-gr .apl{font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  margin-left:4px;padding:5px 11px;border:1px solid var(--s4);border-radius:7px;
  background:transparent;color:var(--s4);cursor:pointer;white-space:nowrap}
.cen-gr .apl:hover:not(:disabled){background:var(--s4);color:#fff}
.cen-gr .apl:disabled{opacity:.45;cursor:default}
/* o Aplicar da Lista de precos sai daqui e muda o outro HTML: cheio, nao vazado */
.cen-gr .apl.pub{background:var(--s4);color:#fff}
.cen-gr .apl.pub:hover:not(:disabled){filter:brightness(1.12)}
.cen-lb{font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);white-space:nowrap;line-height:1.1;flex:0 0 auto}
/* ===== adotar: a Lista de precos passa a usar os custos de Relatorios =====
   Mora entre os dois blocos porque e exatamente o que ele liga. Ligado, o
   bloco da direita fica tracejado: mostra, mas o conteudo e do bloco da
   esquerda. A base propria continua no banco — desligar devolve ela. */
.cen-ado{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:6px;
  padding:5px 9px;border:1px dashed var(--line);border-radius:8px;
  background:var(--sunk);cursor:pointer;max-width:132px;
  font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);line-height:1.15}
.cen-ado input{accent-color:var(--s4);cursor:pointer;flex:0 0 auto;margin:0;
  width:12px;height:12px}
.cen-ado:hover{color:var(--ink-2)}
.cen-ado.on{border-style:solid;border-color:var(--s4);color:var(--s4);
  background:color-mix(in srgb, var(--s4) 10%, var(--card))}
/* o bloco que adota mostra a base do outro: tracejado, para nao parecer dele */
.cen-gr.espelho{border-style:dashed}
.cst-acoes .lida.esp{border-style:solid;border-color:var(--s4);color:var(--s4)}
.cst-cen button{font:inherit;font-size:11px;font-weight:700;letter-spacing:.03em;
  border:1px solid var(--line);background:var(--sunk);color:var(--ink-3);
  padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap;line-height:1.2}
.cst-cen button:hover{color:var(--ink-2)}
.cst-cen button[aria-selected="true"]{background:var(--card);
  border-color:var(--cen-c);color:var(--cen-c);box-shadow:inset 0 0 0 1px var(--cen-c)}
.cst-cen button[data-c$="_atual"]{--cen-c:var(--s4)}
.cst-cen button[data-c$="_nova"]{--cen-c:var(--s1)}
/* a cor do cenario aberto vale para a tela toda */
#cstModal{--cen:var(--s4)}
#cstModal.cen-nova{--cen:var(--s1)}
.cst-acoes{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 14px;
  background:var(--sunk);border-bottom:1px solid var(--line)}
.cst-acoes .msg{font-size:10.5px;color:var(--ink-3)}
.cst-acoes .msg b{color:var(--ink-2)}
.cst-acoes button{font:inherit;font-size:11px;font-weight:700;padding:5px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink-2);cursor:pointer;white-space:nowrap}
.cst-acoes button.apl{border-color:var(--s4);color:var(--s4)}
.cst-acoes button.apl:hover{background:var(--s4);color:#fff}
.cst-acoes button:disabled{opacity:.45;cursor:default}
.cst-acoes .lida{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);border:1px dashed var(--line);border-radius:6px;padding:3px 8px}
/* duas guias: Custos e Agrupamento de itens */
/* a faixa e desenhada por cima das guias fechadas e por baixo da aberta:
   a aberta fica na frente (principal), as outras atras (secundarias) */
.cst-guias{display:flex;flex-wrap:wrap;gap:3px;padding:10px 14px 4px;
  position:relative;border-bottom:0}
.cst-guias::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--cen);z-index:1}
.cst-guia{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.04em;
  border:1px solid var(--line);border-bottom:0;
  background:var(--chip);color:var(--ink-3);
  padding:6px 14px 7px;border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap;
  margin-bottom:-4px;position:relative;z-index:0}
/* a aba aberta passa na FRENTE da faixa e a interrompe */
.cst-guia[aria-selected="true"]{background:var(--card);color:var(--cen);
  border-color:var(--cen);z-index:2;
  box-shadow:inset 0 2px 0 var(--cen)}
.cst-fil{display:flex;align-items:center;gap:9px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--sunk)}
.cst-fil input{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.cst-fil input:focus{outline:2px solid var(--cen);outline-offset:-1px}
.cst-fil .cnt{font-size:10.5px;color:var(--ink-3);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.cst-fil button{font:inherit;font-size:11px;font-weight:600;padding:5px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink-2);cursor:pointer;white-space:nowrap}
.cst-fil button[aria-pressed="true"]{background:var(--cen);color:#fff;border-color:var(--cen)}
.cst-grid{overflow:auto;flex:1;min-height:0}
table.cst{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.cst th{position:sticky;top:0;z-index:2;background:var(--sunk);color:var(--ink-3);
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  text-align:left;padding:7px 9px;border-bottom:1px solid var(--line)}
table.cst th.num,table.cst td.num{text-align:right}
table.cst td{padding:0;border-bottom:1px solid var(--line-2)}
table.cst td.rn{width:38px;text-align:right;padding:0 8px;font-size:10px;color:var(--ink-3);
  background:var(--sunk);font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
table.cst th.rn{width:38px}
table.cst input{font:inherit;font-size:12px;color:var(--ink);background:transparent;
  border:0;padding:6px 9px;width:100%;box-sizing:border-box}
table.cst input:focus{outline:2px solid var(--cen);outline-offset:-2px;background:var(--card)}
table.cst input.num{text-align:right;font-variant-numeric:tabular-nums}
table.cst input::placeholder{color:var(--ink-3);opacity:.75;font-style:italic}
/* uma guia so: cada fonte e uma coluna com o radio da escolha + o valor.
   Colunas estreitas para caber as quatro sem alargar a caixa. */
table.cst th.cc,table.cst td.cc{width:86px;border-left:1px solid var(--line-2)}
table.cst th.cc{padding:5px 0 6px;vertical-align:bottom}
table.cst td.cc{padding:0}
.cch{display:flex;flex-direction:column;gap:3px;align-items:stretch;padding:0 5px}
/* botao que aplica a fonte da coluna a todos os itens listados */
.cch .fs-all{
  font:inherit;font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:5px;background:var(--card);color:var(--ink-3);
  padding:2px 0;cursor:pointer;line-height:1.1;
}
.cch .fs-all:hover{border-color:var(--cen);color:var(--cen)}
.cch span{font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--ink-3);
  text-transform:none;line-height:1.1;text-align:right;padding-right:3px}
.ccw{display:flex;align-items:center;gap:2px;padding:0 5px 0 6px}
.ccw input[type=radio]{width:12px;height:12px;flex:0 0 12px;margin:0;
  accent-color:var(--cen);cursor:pointer}
table.cst .ccw input.num{padding:6px 2px;font-size:11.5px;min-width:0}
/* a coluna marcada no item e a que manda: fica destacada na propria linha */
table.cst td.cc.sel{background:var(--chip);box-shadow:inset 2px 0 0 var(--cen)}
table.cst td.cc.sel input.num{color:var(--cen);font-weight:700}
/* valor que a referencia nao tem e vem do outro item do grupo */
table.cst td.cc.herd input.num::placeholder{color:var(--ink-3);opacity:.9;font-style:normal}
table.cst td.cc.herd::after{content:"";position:absolute}
table.cst td.cc.herd{position:relative}
table.cst td.cc.herd input.num{background:repeating-linear-gradient(-45deg,
  transparent,transparent 5px,var(--line-2) 5px,var(--line-2) 6px)}
table.cst td.uso b.herd{border-bottom:1px dotted var(--ink-3)}
table.cst td.uso{padding:0 9px;text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.cst td.uso b{font-weight:700;color:var(--ink)}
table.cst td.uso i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.03em;
  color:var(--ink-3);margin-left:5px}
table.cst td.uso i.fx{color:var(--cen)}
/* fonte marcada vazia tendo custo em outra: avisa, nao troca sozinho */
table.cst td.uso i.alerta{color:var(--wine-soft);font-weight:700;cursor:help}
.cst-box .hint b.av{color:var(--wine-soft)}
.cst-fil #cstAlerta{border-color:var(--wine-soft);color:var(--wine-soft)}
.cst-fil #cstAlerta[aria-pressed="true"]{background:var(--wine-soft);color:#fff}
/* selo do grupo na guia Custos: quantos itens aquela linha comanda */
.skuw{display:flex;align-items:center;padding-right:7px}
.skuw input{flex:1;min-width:0}
.gsel{display:inline-block;margin-left:7px;font-size:8.5px;font-weight:700;letter-spacing:.04em;
  padding:1px 5px;border-radius:4px;background:var(--cen);color:#fff;vertical-align:1px}
/* ---- guia Agrupamento de itens ---- */
.gr-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;
  border-bottom:1px solid var(--line);background:var(--sunk);position:sticky;top:0;z-index:3}
.gr-bar .msg{font-size:11px;color:var(--ink-3)}
.gr-bar .msg b{color:var(--ink)}
.gr-bar button{font:inherit;font-size:11px;font-weight:700;padding:5px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--card);
  color:var(--ink-2);cursor:pointer;white-space:nowrap}
.gr-bar button.go{border-color:var(--cen);color:var(--cen)}
.gr-bar button.go:hover:not(:disabled){background:var(--cen);color:#fff}
.gr-bar button:disabled{opacity:.45;cursor:default}
table.cst td.gck{width:34px;text-align:center;padding:0}
table.cst td.gck input{width:13px;height:13px;margin:0;accent-color:var(--cen);cursor:pointer;
  padding:0}
table.cst th.gck{width:34px}
table.cst td.gsku{padding:6px 9px;font-variant-numeric:tabular-nums;text-align:left}
table.cst td.gtag{padding:6px 9px;text-align:right;white-space:nowrap;font-size:10px;
  color:var(--ink-3)}
table.cst td.gtag .ref{font-weight:700;color:var(--cen);letter-spacing:.05em}
table.cst td.gtag .mem{color:var(--ink-3)}
table.cst td.gtag button{font:inherit;font-size:9px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;margin-left:8px;padding:2px 7px;border:1px solid var(--line);
  border-radius:5px;background:var(--card);color:var(--ink-3);cursor:pointer}
table.cst td.gtag button:hover{border-color:var(--cen);color:var(--cen)}
/* o primeiro selecionado e a referencia: cor propria e aviso na linha */
table.cst tr.gr-ref td{background:color-mix(in srgb, var(--cen) 16%, transparent)}
table.cst tr.gr-ref td.gsku{font-weight:700;color:var(--cen)}
table.cst tr.gr-sel td{background:var(--chip)}
table.cst tr.gr-in td.gsku{color:var(--ink-2)}
/* ---- lista unica: custo e agrupamento na mesma linha ---- */
/* membro do grupo continua na lista, mas em segundo plano: quem manda no
   custo e a referencia, e e la que se troca a fonte */
table.cst.mrg tr.gr-in td{background:color-mix(in srgb, var(--sunk) 55%, transparent)}
table.cst.mrg tr.gr-in input.num,table.cst.mrg tr.gr-in .skuw input{color:var(--ink-3)}
table.cst.mrg tr.gr-in td.cc{box-shadow:none}
/* SKU que so aparece nas vendas: nao tem valores para mostrar */
table.cst.mrg td.cc.vazio{text-align:center;color:var(--ink-3);padding:7px 0;
  border-left:1px solid var(--line-2)}
table.cst.mrg td.gtag{width:1%}
table.cst.mrg td.gtag .sv{font-style:italic}
table.cst.mrg th.gtag{text-align:right}
/* ---- guia Markup ---- */
table.cst.mk th.uf,table.cst.mk td.uf{width:74px}
table.cst.mk th.pc,table.cst.mk td.pc{width:82px;text-align:right}
table.cst.mk th.rm,table.cst.mk td.rm{width:34px;text-align:center}
table.cst.mk th.pc,table.cst.mk th.num{text-align:right}
table.cst.mk td.div,table.cst.mk td.mkv{padding:0 9px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
table.cst.mk td.mkv b{font-weight:700;color:var(--cen);font-size:13px}
table.cst.mk td.uf input{text-align:center;text-transform:uppercase;letter-spacing:.06em}
table.cst.mk td.rm button{font:inherit;font-size:12px;font-weight:700;line-height:1;
  width:22px;height:22px;border:1px solid var(--line);border-radius:6px;
  background:var(--card);color:var(--ink-3);cursor:pointer}
table.cst.mk td.rm button:hover{border-color:var(--s1);color:var(--s1)}
table.cst.mk tr.ruim td{background:color-mix(in srgb, var(--s1) 10%, transparent)}
table.cst.mk tr.ruim td.div i,table.cst.mk tr.ruim td.mkv i{color:var(--s1);font-style:normal;
  font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
/* SKU que aparece nas vendas mas nao tem custo cadastrado */
table.cst tr.gr-venda td.gsku{color:var(--ink-3);font-style:italic}
table.cst td.gtag .sv{color:var(--ink-3);font-size:9.5px;letter-spacing:.03em}
/* custos das quatro tabelas na guia Agrupamento: so leitura, para comparar
   antes de decidir quem e a referencia. A fonte aplicada fica destacada. */
table.cst th.gc,table.cst td.gc{width:84px;text-align:right;
  border-left:1px solid var(--line-2)}
table.cst th.gc{font-size:9px;padding:7px 8px}
table.cst td.gc{padding:6px 8px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
table.cst td.gc.sel{background:var(--chip);box-shadow:inset 2px 0 0 var(--cen);
  color:var(--cen);font-weight:700}
table.cst td.gc.vazio{color:var(--ink-3)}
/* o cabecalho da lista para logo abaixo da barra de acoes, nao atras dela.
   A altura da barra varia com a mensagem, entao vem medida do JS. */
table.cst.mrg th{top:var(--grbar,44px)}
table.cst tr.fixa td.rn{color:var(--cen)}
table.cst tr.usada td.rn{background:var(--chip);color:var(--cen);font-weight:700}
.cst-box .hint{margin:0;padding:9px 14px 12px;border-top:1px solid var(--line)}
/* indicador da fonte em uso (nao e botao: a troca e em Ver custos) */
.fonte-uso{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;
  padding:6px 12px;border:1px solid var(--s2);border-radius:8px;
  background:var(--chip);color:var(--s2);white-space:nowrap}
.fonte-uso.multi{border-style:dashed}
.vercustos{font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:6px 11px;border:1px solid var(--s2);border-radius:8px;background:transparent;
  color:var(--s2);cursor:pointer;white-space:nowrap}
.vercustos:hover{background:var(--s2);color:#fff}
/* custo aplicado no dashboard que ainda nao foi gravado no banco */
.vercustos.sujo{border-style:dashed}
.vercustos.sujo::after{content:"•";margin-left:6px;font-size:15px;line-height:0;
  vertical-align:middle}
.cst-sujo{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:5px;margin-right:6px;
  border:1px dashed var(--s2);color:var(--s2)}
.admsave{font:inherit;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:7px 16px;border:0;border-radius:8px;background:var(--wine);color:#fff;cursor:pointer}
.admsave:hover{background:var(--wine-soft)}
.admsave[disabled]{opacity:.6;cursor:progress}
#admCard .card-hd{border-bottom-color:var(--s2)}
#admCard .card-hd h2{color:var(--s2)}
code{font-size:.94em;background:var(--sunk);padding:1px 4px;border-radius:4px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 14px 0;border-bottom:1px solid var(--line)}
.tab{
  font:inherit;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 11px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--ink-3);
  border-radius:8px 8px 0 0;cursor:pointer;margin-bottom:-1px;
}
.tab:hover{color:var(--ink-2);background:var(--sunk)}
.tab[aria-selected="true"]{
  background:var(--card);border-color:var(--line);color:var(--wine);
  box-shadow:inset 0 2px 0 var(--wine);
}
.tab .n{font-weight:600;color:var(--ink-3);margin-left:4px}

/* ---------- table ---------- */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
thead th{
  position:sticky;top:0;z-index:3;background:var(--sunk);color:var(--ink-2);
  font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);
  cursor:pointer;user-select:none;
}
thead th:first-child{text-align:left;left:0;z-index:5}
thead th.txt{text-align:left}
thead th.cart{color:var(--s2)}
thead th.cur{color:var(--wine)}
thead th[aria-sort="desc"]::after{content:" ▾";font-size:9px}
thead th[aria-sort="asc"]::after{content:" ▴";font-size:9px}
tbody td{
  padding:4px 8px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap;
  font-family:"Archivo Narrow",Archivo,Arial,sans-serif;font-weight:500;
}
tbody td.cli{
  text-align:left;position:sticky;left:0;background:var(--card);z-index:2;
  font-family:"Archivo",Arial,sans-serif;font-weight:500;max-width:250px;overflow:hidden;
  text-overflow:ellipsis;border-right:1px solid var(--line);
}
tbody td.txt{text-align:left;font-family:Archivo,Arial,sans-serif;color:var(--ink-2);font-size:11.5px}
tbody td.cli.novo{box-shadow:inset 3px 0 0 var(--pos);padding-left:11px}
tbody td.cli.rk{padding-left:11px}
tbody td.cli .pos{color:var(--ink-3);font-weight:600;margin-right:6px;font-size:11px}
tbody tr:hover td,tbody tr:hover td.cli{background:var(--sunk)}
td.zero{color:var(--ink-3);font-weight:400}
td.cart{color:var(--s2);font-weight:700;background:color-mix(in srgb,var(--s2) 8%,transparent)}
tbody tr:hover td.cart{background:color-mix(in srgb,var(--s2) 14%,transparent)}
td.cart.zero{color:var(--ink-3);font-weight:400;background:none}
td.cur{font-weight:700;color:var(--ink)}
td.tot{font-weight:700;border-left:1px solid var(--line)}
td.warn{color:var(--neg);font-weight:700}
/* margem apurada sobre parte pequena do faturamento: sinaliza sem esconder */
td.parc{color:var(--ink-2);text-decoration:underline dotted var(--ink-3);text-underline-offset:3px}
tfoot td.parc{color:var(--ink-2);text-decoration:none}
tfoot td{
  padding:7px 8px;text-align:right;font-weight:700;font-family:"Archivo Narrow",Archivo,sans-serif;
  border-top:2px solid var(--wine-soft);background:var(--sunk);white-space:nowrap;
}
tfoot td:first-child{
  text-align:left;position:sticky;left:0;background:var(--sunk);font-family:Archivo,Arial,sans-serif;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--wine);
}
.tag{
  display:inline-block;font-family:Archivo,sans-serif;font-size:9px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;
  background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos);
}
.newlist{display:flex;flex-wrap:wrap;gap:6px}
.newlist span{font-size:11px;background:var(--chip);border:1px solid var(--line);
  border-radius:6px;padding:3px 7px;color:var(--ink-2)}

#tip{
  position:fixed;pointer-events:none;z-index:90;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:11.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.16);opacity:0;transition:opacity .1s;max-width:240px;
}
#tip b{font-family:"Archivo Narrow",Archivo,sans-serif}
#tip .k{color:var(--ink-3);font-size:10px;letter-spacing:.06em;text-transform:uppercase;display:block}
.empty{padding:26px 14px;text-align:center;color:var(--ink-3);font-size:12.5px}
footer{font-size:10.5px;color:var(--ink-3);text-align:center;padding:2px 0 0;line-height:1.6}

/* toast */
#toast{

/* ============================================================

   A UF vem da coluna "Customer UF" da planilha. Este mapa serve so
   para tapar buracos: se uma linha vier com #N/A ou em branco, o
   painel procura o cliente aqui antes de mostrar "—".

/*DATA_START*/const DATA0 = {"meses":[],"atual":"","ano":2026,"fx":5.1,"rows":[],"reps":[],"clientes":[],"fonte":"Supabase"};/*DATA_END*/

/* O SKU liga a venda (coluna "SKU LIMPO", AF) ao custo. Comparamos sem
   espacos: "WENFUSE 15 0100" e "WENFUSE15 0100" sao o mesmo item. */
const normSku = v => String(v == null ? '' : v).toUpperCase().replace(/\s+/g, '');
/* custos por SKU: {fontes:['COGS1',...], itens:{SKU:[c1,c2,l1,l2]},
   fixos:{SKU:fonte}, grupos:{SKU_REFERENCIA:[outros SKUs do grupo]}} */
/* As fontes sao um MODELO FIXO, nao o que a planilha por acaso trouxe: planilha
   com quatro colunas nao apaga as outras duas, so nao traz valor para elas.
   Para acrescentar uma fonte, basta entrar nesta lista — tela, planilha de
   exportar/importar, banco e tabela de precos seguem daqui. */
const FONTES = ['COGS1','COGS2','LANDED1','LANDED2','LANDED3','ESPECIAL'];
let CUSTOS = {fontes:FONTES.slice(), itens:{}, fixos:{},
              grupos:{}, arquivo:''};
/* Base gravada antes (quatro fontes, ou outra ordem) passa por aqui: cada item
   ganha uma posicao por fonte de HOJE, na ordem de FONTES; fonte que nao existia
   na gravacao entra zerada, sem perder nada do que ja estava la. */
function fontesSeis(fontesGrav, itens){
  const pos = FONTES.map(f=>(fontesGrav || []).indexOf(f));
  const out = {};
  Object.keys(itens || {}).forEach(k=>{
    const v = itens[k] || [];
    out[k] = pos.map(i=> i >= 0 ? cst4(v[i]) : 0);
  });
  return out;
}
/* todo custo trabalha com 4 casas decimais — tela, planilha e banco iguais */
const cst4 = v => { const n = +v; return isFinite(n) && n > 0 ? Math.round(n*1e4)/1e4 : 0; };
/* Agrupamento de itens: SKUs diferentes que sao o mesmo produto
   (6A40PA0100 / 6A40PAEA0100). O item de REFERENCIA manda no custo, e os
   demais do grupo passam a usar o custo dele. GRP_DE e o mapa membro->ref,
   remontado sempre que os grupos mudam. */
/* O ID do item e guardado e mostrado EXATAMENTE como veio na planilha —
   espacos e caixa preservados ("6A40PAEA 0100"). Quem casa venda com custo e
   uma chave derivada (normSku: maiuscula, sem espaco), nunca o texto exibido.
   ITEM_DE: chave -> ID original do item de custo.
   GRP_DE:  chave de qualquer membro -> ID original da referencia do grupo. */
let GRP_DE = {}, ITEM_DE = {}, DUP_SKU = [];
function itensSync(){
  ITEM_DE = {}; DUP_SKU = [];
  Object.keys(CUSTOS.itens || {}).forEach(k=>{
    const n = normSku(k); if (!n) return;
    if (ITEM_DE[n] === undefined) ITEM_DE[n] = k; else DUP_SKU.push(k);
  });
}
function grpSync(){
  GRP_DE = {}; CUSTO_EF = {};
  const g = CUSTOS.grupos || {};
  Object.keys(g).forEach(ref=>{
    const r = normSku(ref); if (!r) return;
    GRP_DE[r] = ref;
    (Array.isArray(g[ref]) ? g[ref] : []).forEach(m=>{
      const k = normSku(m); if (k && k !== r) GRP_DE[k] = ref;
    });
  });
}
/* ID do item de custo que vale para este SKU: a referencia do grupo, se ele
   estiver agrupado; senao o proprio item. '' quando nao ha custo cadastrado. */
function custoKey(sku){
  const n = normSku(sku); if (!n) return '';
  return GRP_DE[n] || ITEM_DE[n] || '';
}
/* Custos efetivos de um item de custo. Estando agrupado, o grupo vale como UM
   item: onde a REFERENCIA tem valor, manda o dela; onde ela esta zerada, entra
   o valor do primeiro membro do grupo que tiver aquela fonte. E o caso do
   par PA/PAEA, em que cada codigo traz metade da tabela preenchida.
   `de` diz de qual item saiu cada valor, para a tela poder mostrar. */
function custosDoGrupo(ref, itens, grupos){
  const n = (itens && itens[ref]) || [];
  const v = CUSTOS.fontes.map((f,j)=>+n[j] || 0);
  const de = CUSTOS.fontes.map(()=>ref);
  const mem = (grupos && grupos[ref]) || [];
  if (mem.length) v.forEach((x,j)=>{
    if (x > 0) return;
    for (let i = 0; i < mem.length; i++){
      const c = itens[mem[i]], y = c ? +c[j] || 0 : 0;
      if (y > 0){ v[j] = y; de[j] = mem[i]; return; }
    }
  });
  return {v, de};
}
/* memoria dos custos efetivos do CUSTOS — refeita sempre que os grupos mudam */
let CUSTO_EF = {};
function custoEf(ref){
  if (!CUSTO_EF[ref]) CUSTO_EF[ref] = custosDoGrupo(ref, CUSTOS.itens, CUSTOS.grupos);
  return CUSTO_EF[ref];
}

/* Margem por custo: (venda - qtd x custo unitario) / venda.
   Quem manda e a fonte escolhida PARA O ITEM na tela de custos. Nao existe
   mais "auto" nem substituicao pelo menor custo: se a fonte escolhida nao
   tiver valor para aquele item, ele fica sem custo e a margem volta a ser a
   que veio na planilha de vendas. A chave CUSTO do painel so vale para item
   que ainda nao tenha escolha (situacao que garantirFontes() elimina). */
/* Sem "auto", todo item precisa de uma fonte escolhida. Quem ainda nao tem
   (base antiga, ou item novo vindo de planilha) recebe a fonte padrao salva:
   nada muda de valor na virada, e da para trocar item a item depois. */
function garantirFontes(){
  const pad = (CUSTOS.fontes.indexOf(CUSTOS.padrao) >= 0 && CUSTOS.padrao)
           || (CUSTOS.fontes.indexOf(S.custo) >= 0 && S.custo)
           || CUSTOS.fontes[0];
  if (!pad) return 0;
  CUSTOS.fixos = CUSTOS.fixos || {};
  CUSTOS.grupos = CUSTOS.grupos || {};
  itensSync();
  /* grupo cuja REFERENCIA sumiu da tabela deixa de existir — sem ela nao ha
     custo para o grupo. Os membros NAO precisam estar na tabela de custos: o
     caso normal e justamente um SKU que so aparece nas vendas (6A40PA 0100)
     pendurado num item de custo (6A40PAEA 0100). */
  Object.keys(CUSTOS.grupos).forEach(ref=>{
    if (!CUSTOS.itens[ref]){ delete CUSTOS.grupos[ref]; return; }
    const mem = (CUSTOS.grupos[ref] || []).filter(m=>m && m !== ref);
    if (mem.length) CUSTOS.grupos[ref] = mem; else delete CUSTOS.grupos[ref];
  });
  grpSync();
  let n = 0;
  Object.keys(CUSTOS.itens).forEach(k=>{
    if (CUSTOS.fontes.indexOf(CUSTOS.fixos[k] || '') < 0){ CUSTOS.fixos[k] = pad; n++; }
  });
  return n;
}
function temCustos(){ return !!Object.keys(CUSTOS.itens).length; }


/* ---------- tela de custos: uma guia por fonte, celulas simples ----------
   Nao e uma planilha de verdade: so linhas e colunas para conferir e digitar.
   O estado editado fica em CST_EDIT ate o botao Salvar. */
/* CST_PAD: indice da fonte padrao — vale para linha nova e para item que
   porventura fique sem escolha. As guias agora sao Custos / Agrupamento.
   CST_GRUPOS e a copia editavel dos grupos; GR_SEL guarda a selecao da guia
   de agrupamento NA ORDEM DE CLIQUE — o primeiro e a referencia. */
let CST_EDIT = null, CST_PAD = 0, CST_Q = '', CST_USO = false;
let CST_TAB = 'custos', CST_GRUPOS = {}, GR_SEL = [], CST_ALERTA = false;
/* ha custo aplicado no dashboard que ainda nao foi gravado no banco */
let CST_SUJO = false;
/* mapa membro->referencia da copia em edicao (nao mexe no GRP_DE global) */
function cstGrpDe(){
  const m = {};
  Object.keys(CST_GRUPOS).forEach(ref=>{
    m[normSku(ref)] = ref;
    (CST_GRUPOS[ref] || []).forEach(x=>{ if (x !== ref) m[normSku(x)] = ref; });
  });
  return m;
}
/* indices das linhas visiveis agora: e sobre elas que o botao "todas" age */
let CST_VIS = [];
const cstNum = v => {
  const x = String(v == null ? '' : v).trim().replace(/\s/g,'');
  if (!x) return 0;
  const y = (x.indexOf(',') >= 0 && x.indexOf('.') >= 0) ? x.replace(/\./g,'').replace(',','.')
          : x.replace(',','.');
  return cst4(parseFloat(y));   /* 4 casas: o que aparece e o que calcula */
};

/* ============ os quatro cenarios de custo ============
   relatorio_atual / relatorio_nova -> margem do relatorio
   precos_atual    / precos_nova    -> custo da tabela de precos
   "Atual" e o que esta valendo: so leitura. "Nova" e rascunho: edita, salva,
   e o botao Aplicar promove a Nova sobre a Atual, com confirmacao. */
const CENARIOS = ['relatorio_atual','relatorio_nova','precos_atual','precos_nova'];
const cenNova = c => c.slice(-5) === '_nova';
const cenPar  = c => cenNova(c) ? c.replace('_nova','_atual') : c.replace('_atual','_nova');
function cenVazio(){
  return {fontes: FONTES.slice(), itens:{}, fixos:{}, grupos:{},
          padrao: FONTES[0], arquivo:'', itens_origem:{}};
}
/* base de cada cenario, como veio do banco; o que esta na tela e o CST_EDIT */
let CST_BASES = {}, CST_CEN = 'relatorio_nova';   /* abre no rascunho, que e onde se trabalha */
/* Lista de precos adotando os custos e o agrupamento de Relatorios: enquanto
   ligado, as duas bases de precos espelham as de relatorio e nao sao editaveis.
   A base propria de precos continua guardada no banco — desligar devolve ela. */
/* '' = cada grupo com a sua base. 'precos' = a Lista de precos adota a base de
   Relatorios; 'relatorio' = o contrario. Nunca os dois: o valor guarda QUEM
   adota. Quem adota mostra a base do outro, somente leitura, e a sua propria
   continua gravada no banco — desmarcar devolve ela, intacta. */
let ESPELHO = '';
const cenGrp   = c => c.slice(0,9) === 'relatorio' ? 'relatorio' : 'precos';
const cenOutro = g => g === 'precos' ? 'relatorio' : 'precos';
const cenEspelhado = c => !!ESPELHO && cenGrp(c) === ESPELHO;
/* de qual base o cenario le de fato */
const cenFonte = c => cenEspelhado(c)
  ? cenOutro(ESPELHO) + c.slice(cenGrp(c).length) : c;
const cenAtualObj = () => CST_BASES[cenFonte(CST_CEN)] || cenVazio();
const cenSoLeitura = () => !cenNova(CST_CEN) || cenEspelhado(CST_CEN);
/* guarda o que esta na tela de volta na base do cenario (so em memoria) */
function cstGuarda(){
  if (!CST_EDIT || cenSoLeitura()) return;   /* inclui o caso espelhado */
  const c = cstColeta();
  const b = CST_BASES[CST_CEN] || (CST_BASES[CST_CEN] = cenVazio());
  b.itens = c.itens; b.fixos = c.fixos; b.grupos = c.grupos;
  b.padrao = CUSTOS.fontes[CST_PAD] || b.padrao;
}
/* joga a base do cenario na tela */
function cstCarrega(cen){
  CST_CEN = cen;
  const src = cenFonte(cen);
  const b = CST_BASES[src] || (CST_BASES[src] = cenVazio());
  const padCen = (CUSTOS.fontes.indexOf(b.padrao) >= 0 && b.padrao) || CUSTOS.fontes[0];
  CST_EDIT = Object.keys(b.itens).sort().map(k=>({
    sku: k, v: CUSTOS.fontes.map((f,i)=> cst4((b.itens[k]||[])[i])),
    /* sem escolha gravada, o item segue a fonte padrao do cenario */
    fixo: (CUSTOS.fontes.indexOf((b.fixos||{})[k]) >= 0 ? b.fixos[k] : padCen)
  }));
  CST_GRUPOS = {};
  Object.keys(b.grupos || {}).forEach(ref=>{
    const mem = (b.grupos[ref] || []).filter(m=>m !== ref);
    if (mem.length) CST_GRUPOS[ref] = mem.slice();
  });
  GR_SEL = [];
  CST_PAD = Math.max(0, CUSTOS.fontes.indexOf(b.padrao || S.custo));
  CST_TAB = 'custos'; CST_Q = ''; CST_USO = false; CST_ALERTA = false;
  const q = el('cstQ'); if (q) q.value = '';
  el('cstUso').setAttribute('aria-pressed','false');
}
function cstAbrir(){
  if (!ADM || !temCustos()) return;
  /* sem os quatro cenarios no banco (versao antiga), o que ha e o relatorio */
  if (!CST_BASES.relatorio_atual){
    CST_BASES.relatorio_atual = {fontes:CUSTOS.fontes.slice(), itens:CUSTOS.itens,
      fixos:CUSTOS.fixos, grupos:CUSTOS.grupos, padrao:CUSTOS.padrao,
      arquivo:CUSTOS.arquivo, itens_origem:CUSTOS.itens};
  }
  CENARIOS.forEach(c=>{ if (!CST_BASES[c]) CST_BASES[c] =
    JSON.parse(JSON.stringify(CST_BASES.relatorio_atual)); });
  cstCarrega(CST_CEN);
  el('cstModal').hidden = false;
  cstRender();
}
/* barra dos cenarios */
function cstCenBar(){
  const L = t();
  /* dois blocos separados: o nome do grupo aparece uma vez so, e as duas bases
     ficam dentro dele — assim nao parecem quatro abas do mesmo conjunto */
  const grupo = g => {
    const aberto = CST_CEN === g+'_nova';
    const nItens = Object.keys(((CST_BASES[g+'_nova']||{}).itens) || {}).length;
    /* bloco aberto = o que contem o cenario selecionado, em qualquer das duas bases */
    const meu = CST_CEN === g+'_atual' || aberto;
    const esp = ESPELHO === g;          /* este bloco adota o do lado */
    const fonte = L.cenGrupo(cenOutro(g)+'_atual');
    return '<div class="cen-gr'+(meu ? ' ativo' : '')+(esp ? ' espelho' : '')+'">'
    + '<span class="cen-lb">'+esc(L.cenGrupo(g+'_atual'))+'</span>'
    + [g+'_atual', g+'_nova'].map(c=>
        '<button type="button" role="tab" data-c="'+c+'"'
        + ' aria-selected="'+(CST_CEN===c)+'">'+esc(L.cenNome(c))+'</button>').join('')
    /* o Aplicar nasce ao lado da Nova aberta: nao ha duvida de qual par ele age.
       Adotando Relatorios nao ha o que aplicar: o conteudo nem e desta base */
    /* no grupo Lista de precos o botao diz para onde vai: e ele que troca os
       custos do HTML da tabela de precos, nao so a base daqui */
    + (aberto && !esp ? '<button type="button" class="apl'+(g==='precos'?' pub':'')+'" id="cstAplicarBt"'
                + (nItens ? '' : ' disabled')
                + ' title="'+esc(g==='precos' ? L.cenAplicarPrecosTip
                                              : L.cenAplicarTip(L.cenGrupo(g+'_atual')))+'">'
                + esc(g==='precos' ? L.cenAplicarPrecos : L.cenAplicarCurto) + '</button>' : '')
    /* adotar mora dentro do bloco que adota: o texto diz de quem */
    + '<label class="cen-ado'+(esp ? ' on' : '')+'" title="'+esc(L.cenAdotarTip(fonte))+'">'
    + '<input type="checkbox" data-ado="'+g+'"'+(esp ? ' checked' : '')+'>'
    + '<span>'+esc(L.cenAdotar(fonte))+'</span></label>'
    + '</div>';
  };
  setH('cstCen', grupo('relatorio') + grupo('precos'));
  /* verde = base em uso; vermelho = rascunho ainda nao aplicado */
  el('cstModal').classList.toggle('cen-nova', cenNova(CST_CEN));
  const fnt = L.cenGrupo(cenOutro(cenGrp(CST_CEN))+'_atual');
  setH('cstAcoes', cenEspelhado(CST_CEN)
    ? '<span class="lida esp">'+esc(L.cenAdotado(fnt))+'</span>'
      + '<span class="msg">'+L.cenAdotadoMsg(fnt)+'</span>'
    : cenSoLeitura()
    ? '<span class="lida">'+esc(L.cenSoLeitura)+'</span>'
      + '<span class="msg">'+esc(L.cenSoLeituraMsg(L.cenNome(cenPar(CST_CEN))))+'</span>'
    : '<button type="button" id="cstOrigemBt">'+esc(L.cenOrigem)+'</button>'
      + '<span class="msg">'+L.cenNovaMsg(CST_CEN.slice(0,6)==='precos'
          ? L.cenAplicarPrecos : L.cenAplicarCurto)+'</span>');
}

/* ============ guia unica: custo do item E agrupamento na mesma tela ============
   Antes eram duas guias e o mesmo item aparecia nas duas, com informacao pela
   metade em cada. Agora e uma lista so: cada linha traz as quatro fontes com o
   radio que escolhe a que vale, a caixinha que seleciona o item para agrupar e,
   a direita, em que grupo ele esta. Item que virou membro de um grupo continua
   na lista — antes ele sumia — em segundo plano, porque quem manda no custo do
   grupo e a referencia. */
function cstRender(){
  cstGuias();
  cstBotoesTopo();
  if (CST_TAB === 'markup') return mkRender();
  /* cenario "Atual" e retrato do que esta valendo: nada e editavel nele */
  const RO = cenSoLeitura() ? ' disabled' : '', ROT = cenSoLeitura() ? ' readonly' : '';
  const L = t(), f = CUSTOS.fontes[CST_PAD] || '';
  const gd = cstGrpDe();
  const usados = new Set(R.filter(r=>r.st==='I' && r.sku).map(r=>custoKey(r.sku)).filter(Boolean));
  const vendidos = new Set(R.filter(r=>r.st==='I' && r.sku).map(r=>normSku(r.sku)).filter(Boolean));
  /* SKU que aparece nas vendas e nao tem custo cadastrado: e justamente o que
     se quer agrupar (venda "6A40PA 0100" x custo "6A40PAEA 0100"). Entra na
     lista como linha sem valores — pode ser membro, nunca referencia. */
  const comCusto = new Set(CST_EDIT.map(o=>normSku(o.sku)).filter(Boolean));
  const soVenda = [], jaVi = new Set();
  R.forEach(r=>{
    const n = normSku(r.sku); if (!n || comCusto.has(n) || jaVi.has(n)) return;
    jaVi.add(n);
    soVenda.push({sku: r.sku0 || r.sku, venda:true, v:null, fixo:''});
  });
  soVenda.sort((a,b)=>a.sku.localeCompare(b.sku));
  /* [item, indice em CST_EDIT] — indice -1 para o SKU so-de-venda, que nao
     existe na tabela de custos e por isso nao tem celula editavel */
  const base = CST_EDIT.map((o,i)=>[o,i]).concat(soVenda.map(o=>[o,-1]));
  /* itens cuja fonte marcada esta vazia mas que TEM custo em outra fonte:
     ficam de fora do calculo sem precisar — o botao de alerta isola eles */
  const falta = new Set();
  base.forEach(x=>{
    if (x[1] < 0 || gd[normSku(x[0].sku)]) return;   /* membro nao manda no custo */
    const fa = cstFalta(x[0]);
    if (fa && fa.outras.length) falta.add(x[1]);
  });
  const bA = el('cstAlerta');
  if (bA){
    bA.hidden = !falta.size;
    if (!falta.size) CST_ALERTA = false;
    bA.textContent = L.cstAlerta(falta.size);
    bA.setAttribute('aria-pressed', CST_ALERTA);
    bA.title = L.cstAlertaTip;
  }
  /* o filtro compara pela chave (sem espaco, maiuscula) e alcanca o grupo
     inteiro: digitar o codigo de um membro deixa a referencia na tela tambem,
     que e o que permite conferir o par antes de agrupar */
  const q = normSku(CST_Q);
  const casa = o => {
    const n = normSku(o.sku);
    if (n.indexOf(q) >= 0) return true;
    if ((CST_GRUPOS[o.sku] || []).some(m=>normSku(m).indexOf(q) >= 0)) return true;
    const r = gd[n];
    return !!r && (normSku(r).indexOf(q) >= 0
      || (CST_GRUPOS[r] || []).some(m=>normSku(m).indexOf(q) >= 0));
  };
  const vis = base.filter(x=>
    (!q || casa(x[0]))
    && (!CST_USO || usados.has(x[0].sku) || vendidos.has(normSku(x[0].sku)))
    && (!CST_ALERTA || falta.has(x[1])));
  const nGrupos = Object.keys(CST_GRUPOS).length;
  set('cstSub', L.cstSubMix(CST_EDIT.length, nGrupos, Object.keys(gd).length - nGrupos,
                            CUSTOS.arquivo || f));
  set('cstCnt', L.cstCnt(vis.length, base.length));
  /* "todas" so age sobre quem de fato manda no proprio custo */
  CST_VIS = vis.filter(x=>x[1] >= 0 && !gd[normSku(x[0].sku)]).map(x=>x[1]);

  /* ---- barra de agrupar, fixa no topo da lista ---- */
  const ref = GR_SEL[0] || '';
  const refSemCusto = !!ref && !comCusto.has(normSku(ref));
  const podeAgrupar = GR_SEL.length >= 2 && !refSemCusto;
  const barra = '<div class="gr-bar">'
    + '<button type="button" class="go" id="grDo"'+((podeAgrupar && !cenSoLeitura()) ? '' : ' disabled')+'>'
    + esc(L.grAgrupar(GR_SEL.length)) + '</button>'
    + '<button type="button" id="grClr"'+(GR_SEL.length ? '' : ' disabled')+'>'
    + esc(L.grLimpar) + '</button>'
    + '<span class="msg">'
    + (refSemCusto ? '<b>'+esc(L.grRefSemCusto(ref))+'</b>'
       : GR_SEL.length ? L.grRefMsg(esc(ref)) : esc(L.grAjuda)) + '</span>'
    + (soVenda.length ? '<span class="msg" style="margin-left:auto">'
        + esc(L.grSoVendaCnt(soVenda.length)) + '</span>' : '')
    + '</div>';

  /* cabecalho: uma coluna por fonte, com o botao que aplica aquela fonte a
     todos os itens listados logo acima do nome */
  const cabFontes = CUSTOS.fontes.map((x,i)=>
    '<th class="cc"><div class="cch">'
    + '<button type="button" class="fs-all" data-f="'+i+'" title="'+esc(L.cstTodasTip(x))+'"'
    + RO + '>' + esc(L.cstTodas)+'</button><span>'+esc(x)+'</span></div></th>').join('');

  setH('cstGrid', barra
    + '<table class="cst mrg"><thead><tr><th class="gck"></th><th>'+esc(L.cstItem)+'</th>'
    + cabFontes
    + '<th class="num">'+esc(L.cstUsado)+'</th>'
    + '<th class="gtag">'+esc(L.grSituacao)+'</th></tr></thead><tbody>'
    + (vis.length ? vis.map(x=>{
        const o = x[0], i = x[1];
        const memDe = gd[normSku(o.sku)] || '';          /* referencia que comanda */
        const ehMembro = !!memDe && memDe !== o.sku;
        const mem = CST_GRUPOS[o.sku] || [];
        const ehRef = mem.length > 0;
        const iSel = GR_SEL.indexOf(o.sku);
        const ef = i >= 0 ? cstVef(o) : null;
        /* radio + valor na mesma celula: a fonte marcada e a que manda.
           No membro o radio fica travado — quem escolhe a fonte do grupo e a
           referencia —, mas os valores continuam abertos, porque fonte que a
           referencia tem zerada e preenchida pelo membro. */
        const cel = (fn,j) => {
          if (i < 0) return '<td class="cc vazio">–</td>';
          const herd = ef.de[j] && ef.de[j] !== o.sku && +ef.v[j] > 0;
          return '<td class="cc'+((o.fixo===fn && !ehMembro) ? ' sel' : '')+(herd ? ' herd' : '')
          + '" data-cc="'+i+'-'+j+'"><div class="ccw">'
          + '<input type="radio" name="fs'+i+'" data-i="'+i+'"'
          + ' title="'+esc(ehMembro ? L.cstFonteDoGrupo(memDe) : L.cstTodasTip(fn))+'"'
          + ' value="'+esc(fn)+'"' + (o.fixo===fn ? ' checked' : '')
          + ((ehMembro || cenSoLeitura()) ? ' disabled' : '') + '>'
          + '<input class="num" data-i="'+i+'" data-k="v" data-f="'+j+'"'
          + ' value="'+esc(cstTxt(o.v[j]))+'"' + ROT
          + (herd ? ' placeholder="'+esc(cstTxt(ef.v[j]))+'" title="'
                    + esc(L.cstDoGrupo(ef.de[j]))+'"' : '')
          + '></div></td>';
        };
        /* situacao: em que grupo o item esta, e como sair dele */
        let tag = '';
        if (ehRef) tag = '<span class="ref">'+esc(L.grRef)+'</span> · '
          + esc(L.grComanda(mem.length))
          + '<button type="button" data-des="'+esc(o.sku)+'">'+esc(L.grDesagrupar)+'</button>';
        else if (ehMembro) tag = '<span class="mem">→ '+esc(memDe)+'</span>'
          + '<button type="button" data-sai="'+esc(o.sku)+'">'+esc(L.grTirar)+'</button>';
        else if (iSel === 0) tag = '<span class="ref">'+esc(L.grRef)+'</span>';
        else if (iSel > 0) tag = '<span class="mem">'+esc(L.grSelecionado)+'</span>';
        else if (o.venda) tag = '<span class="sv">'+esc(L.grSoVenda)+'</span>';
        const cls = ['cst-l'];
        if (iSel === 0) cls.push('gr-ref'); else if (iSel > 0) cls.push('gr-sel');
        else if (ehMembro) cls.push('gr-in');
        if (o.venda) cls.push('gr-venda');
        if (usados.has(o.sku)) cls.push('usada');
        if (o.fixo && !ehMembro) cls.push('fixa');
        const selo = ehRef
          ? '<span class="gsel" title="'+esc(L.cstGrupoTip(mem))+'">+'+mem.length+'</span>' : '';
        return '<tr class="'+cls.join(' ')+'">'
          + '<td class="gck"><input type="checkbox" data-g="'+esc(o.sku)+'"'
          + (iSel >= 0 ? ' checked' : '')
          + ((ehMembro || cenSoLeitura()) ? ' disabled' : '') + '></td>'
          + (i < 0
             ? '<td class="gsku">'+esc(o.sku)+'</td>'
             : '<td><div class="skuw"><input data-i="'+i+'" data-k="sku" value="'+esc(o.sku)
               + '" spellcheck="false"' + ROT
               + ((ehRef || ehMembro) ? ' readonly title="'+esc(L.cstIdTravado)+'"' : '')
               + '>' + selo + '</div></td>')
          + CUSTOS.fontes.map(cel).join('')
          + (i < 0 || ehMembro
             ? '<td class="uso"><i>–</i></td>'
             : '<td class="uso" data-uso="'+i+'">'+cstUsoTxt(o, ef)+'</td>')
          + '<td class="gtag">'+tag+'</td></tr>';
      }).join('')
      : '<tr><td class="empty" colspan="'+(CUSTOS.fontes.length+4)+'"'
        + ' style="padding:14px;color:var(--ink-3)">' + esc(L.cstVazio) + '</td></tr>')
    + '</tbody></table>');
  /* a barra de acoes muda de altura conforme a mensagem: mede e avisa o
     cabecalho grudento onde ele deve parar */
  const bar = el('cstGrid').querySelector('.gr-bar');
  el('cstGrid').style.setProperty('--grbar', (bar ? bar.offsetHeight : 44) + 'px');
  const nfx = CST_EDIT.filter(o=>o.fixo).length;
  setH('cstHint', L.cstHint(f) + (nfx ? ' <b>· '+esc(L.cstFixos(nfx))+'</b>' : '')
    + (falta.size ? ' <b class="av">· '+esc(L.cstAlertaHint(falta.size))+'</b>' : ''));
}
/* custo que vale para o item: exatamente a fonte escolhida nele. Sem valor
   naquela fonte, o item fica sem custo — nao ha mais troca automatica. */
/* vetor efetivo da linha da tela: o proprio item, completado pelo grupo */
function cstVef(o){
  if (!o || !o.v) return {v: CUSTOS.fontes.map(()=>0), de: []};
  if (!CST_GRUPOS[o.sku]) return {v:o.v, de: CUSTOS.fontes.map(()=>o.sku)};
  const it = {}; CST_EDIT.forEach(x=>{ if (x.sku) it[x.sku] = x.v; });
  return custosDoGrupo(o.sku, it, CST_GRUPOS);
}
function cstEfetivo(o, vef){
  const e = vef || cstVef(o);
  const fx = o.fixo ? CUSTOS.fontes.indexOf(o.fixo) : -1;
  const i = fx >= 0 ? fx : CST_PAD;
  return {u: +e.v[i] || 0, src: CUSTOS.fontes[i], fixo: fx >= 0,
          de: (e.de && e.de[i] !== o.sku) ? e.de[i] : ''};
}

/* ============ guia Markup ============
   Cenarios de venda por ORIGEM -> DESTINO, cada um com suas aliquotas.
   Formula igual a que a tabela de precos ja usa no banco:
     divisor = 1 - icms - pis*(1-icms) - comissao - margem
     markup  = 1 / divisor        preco = custo x markup
   O PIS/COFINS incide sobre a base ja deduzida do ICMS — e por isso que
   entra multiplicado por (1-icms), e nao somado direto.
   As aliquotas sao digitadas em PORCENTO e guardadas em decimal. */
let MARKUPS = [];
const mkPct = v => {            /* "9,25" -> 0.0925 */
  const x = String(v == null ? '' : v).trim().replace(',', '.');
  const n = parseFloat(x);
  return isFinite(n) ? Math.round(n * 1e6) / 1e8 : 0;
};
const mkTxt = v => {            /* 0.0925 -> "9,25" */
  const n = (+v || 0) * 100;
  if (!n) return '';
  const x = Math.round(n * 1e4) / 1e4;
  return (S.lang === 'en' ? String(x) : String(x).replace('.', ','));
};
function mkDivisor(m){
  const i = +m.icms || 0, p = +m.pis || 0;
  return 1 - i - p * (1 - i) - (+m.comissao || 0) - (+m.margem || 0);
}
function mkNovo(){
  return {id: 'm' + Date.now().toString(36), nome: '', origem: '', destino: '',
          icms: 0, pis: 0.0925, comissao: 0, margem: 0};
}
function mkRender(){
  const L = t();
  set('cstSub', L.mkSub(MARKUPS.length));
  set('cstCnt', '');
  /* UFs que aparecem nas vendas viram sugestao nos campos de origem/destino */
  const ufs = [];
  const whs = [];
  const lista = [...new Set(whs.concat(ufs))];
  const campo = (i, k, v, cls) =>
    '<input class="' + cls + '" data-mk="' + i + '" data-k="' + k + '" value="' + esc(v) + '">';
  setH('cstGrid',
    '<datalist id="mkUfs">' + lista.map(u => '<option value="' + esc(u) + '">').join('') + '</datalist>'
    + '<table class="cst mk"><thead><tr>'
    + '<th class="rn"></th><th>' + esc(L.mkCenario) + '</th>'
    + '<th class="uf">' + esc(L.mkOrigem) + '</th><th class="uf">' + esc(L.mkDestino) + '</th>'
    + ['mkIcms','mkPis','mkCom','mkMrg'].map(x =>
        '<th class="pc">' + esc(L[x]) + '</th>').join('')
    + '<th class="num">' + esc(L.mkDiv) + '</th>'
    + '<th class="num">' + esc(L.mkMarkup) + '</th><th class="rm"></th></tr></thead><tbody>'
    + (MARKUPS.length ? MARKUPS.map((m, i) => {
        const d = mkDivisor(m), ok = d > 0.0001;
        return '<tr' + (ok ? '' : ' class="ruim"') + '>'
          + '<td class="rn">' + (i + 1) + '</td>'
          + '<td>' + campo(i, 'nome', m.nome || '', '') + '</td>'
          + '<td class="uf"><input class="uf" list="mkUfs" data-mk="' + i + '" data-k="origem" value="'
          + esc(m.origem || '') + '"></td>'
          + '<td class="uf"><input class="uf" list="mkUfs" data-mk="' + i + '" data-k="destino" value="'
          + esc(m.destino || '') + '"></td>'
          + ['icms','pis','comissao','margem'].map(k =>
              '<td class="pc">' + campo(i, k, mkTxt(m[k]), 'num') + '</td>').join('')
          + '<td class="num div">' + (ok ? nf4(d) : '<i>' + esc(L.mkInvalido) + '</i>') + '</td>'
          + '<td class="num mkv">' + (ok ? '<b>' + nf4(1 / d) + '</b>' : '<i>–</i>') + '</td>'
          + '<td class="rm"><button type="button" data-rm="' + i + '" title="'
          + esc(L.mkRemover) + '">x</button></td></tr>';
      }).join('')
      : '<tr><td class="empty" colspan="10" style="padding:14px;color:var(--ink-3)">'
        + esc(L.mkVazio) + '</td></tr>')
    + '</tbody></table>');
  setH('cstHint', L.mkHint);
}
el('cstGrid').addEventListener('input', e => {
  const n = e.target;
  if (!n.dataset || n.dataset.mk === undefined) return;
  const m = MARKUPS[+n.dataset.mk]; if (!m) return;
  const k = n.dataset.k;
  if (k === 'nome') m.nome = n.value;
  else if (k === 'origem' || k === 'destino') m[k] = n.value.toUpperCase();
  else m[k] = mkPct(n.value);
  /* recalcula so as duas celulas da linha, sem perder o campo em edicao */
  const tr = n.closest('tr'); if (!tr) return;
  const d = mkDivisor(m), ok = d > 0.0001;
  tr.classList.toggle('ruim', !ok);
  const cd = tr.querySelector('.div'), cm = tr.querySelector('.mkv');
  if (cd) cd.innerHTML = ok ? nf4(d) : '<i>' + esc(t().mkInvalido) + '</i>';
  if (cm) cm.innerHTML = ok ? '<b>' + nf4(1 / d) + '</b>' : '<i>–</i>';
});
el('cstGrid').addEventListener('click', e => {
  const b = e.target.closest('button[data-rm]'); if (!b) return;
  MARKUPS.splice(+b.dataset.rm, 1);
  mkRender();
});
async function mkSalvar(){

    id: m.id, nome: String(m.nome || '').trim(),

  }));

/* ============ guia Agrupamento de itens ============
   Agrupa SKUs que sao o mesmo produto com sufixo diferente
   (6A40PA0100 / 6A40PAEA0100). O PRIMEIRO item marcado e a REFERENCIA: e o
   custo dele que passa a valer para todos os outros do grupo, tanto na guia
   Custos quanto no calculo da margem. O filtro de cima vai estreitando a
   lista a cada caractere digitado, que e como se acha o conjunto a agrupar. */
/* marcar/desmarcar preservando a ORDEM: o primeiro marcado e a referencia */
function grToggle(sku){
  const i = GR_SEL.indexOf(sku);
  if (i >= 0) GR_SEL.splice(i, 1); else GR_SEL.push(sku);
  cstRender();
}
function grAgrupar(){
  if (GR_SEL.length < 2) return;
  const ref = GR_SEL[0];
  /* a referencia tem de ter custo: e dela que sai o valor do grupo */
  if (!CST_EDIT.some(o=>o.sku && normSku(o.sku) === normSku(ref))){
    toast(t().grRefSemCusto(ref), true); return;
  }
  const mem = GR_SEL.slice(1).filter(x=>x !== ref);
  if (!mem.length) return;
  /* referencia nova absorve grupo que algum selecionado ja comandava */
  const juntos = new Set(mem);
  mem.forEach(m=>{ (CST_GRUPOS[m] || []).forEach(x=>{ if (x !== ref) juntos.add(x); }); });
  mem.forEach(m=>delete CST_GRUPOS[m]);
  (CST_GRUPOS[ref] || []).forEach(x=>{ if (x !== ref) juntos.add(x); });
  CST_GRUPOS[ref] = [...juntos];
  GR_SEL = [];
  cstRender();
  cstAplicar();   /* agrupar muda o custo das vendas dos membros */
}
function grDesagrupar(ref){
  delete CST_GRUPOS[ref]; GR_SEL = []; cstRender(); cstAplicar();
}
function grTirar(sku){
  const gd = cstGrpDe(), ref = gd[normSku(sku)];
  if (!ref || ref === sku) return;
  const mem = (CST_GRUPOS[ref] || []).filter(x=>x !== sku);
  if (mem.length) CST_GRUPOS[ref] = mem; else delete CST_GRUPOS[ref];
  cstRender();
  cstAplicar();
}
/* Salvar, + Linha e Importar so existem nos cenarios "Nova" */

  const b2 = el('cstAdd');  if (b2) b2.hidden = mk ? false : ro;
  const b3 = el('cstImp');  if (b3) b3.hidden = mk ? true  : ro;
  const b4 = el('cstExp');  if (b4) b4.hidden = mk;
}

/* promove o rascunho aberto sobre a base em uso do mesmo par */
async function cstAplicarAgora(btn){
  const L = t(), alvo = cenPar(CST_CEN), prec = CST_CEN.slice(0,6) === 'precos';
  if (cenSoLeitura()) return;
  if (!confirm(prec ? L.cenAplicarPrecosConf
                    : L.cenAplicarConf(L.cenGrupo(CST_CEN), L.cenNome(CST_CEN), L.cenNome(alvo)))) return;
  cstGuarda();
  if (btn) btn.disabled = true;
  try{
    /* grava o rascunho e so entao promove, para aplicar o que esta na tela */
    await cstSalvarCenario(CST_CEN);
    if (SB_ON){
      const d = await sbRpc('wgi_painel_aplicar_custos', {p_de: CST_CEN, p_para: alvo});

function cstFalta(o, vef){
  const i = CUSTOS.fontes.indexOf(o.fixo);

/* Junta o que esta na tela (CST_EDIT + CST_GRUPOS) no formato do CUSTOS.
   A chave gravada e o ID como esta na tela, com espacos e caixa originais.
   Duas linhas que so diferem em espaco/caixa sao o mesmo item: fica a
   primeira. Usado tanto pelo recalculo ao vivo quanto pelo Salvar. */
function cstColeta(){
  const itens = {}, fixos = {}, vistos = {}, dups = [];
  let vazio = false;
  CST_EDIT.forEach(o=>{
    const k = String(o.sku == null ? '' : o.sku).trim();
    if (!k){ if (o.v.some(x=>x>0)) vazio = true; return; }
    const n = normSku(k);
    if (vistos[n]){ dups.push(k); return; }
    vistos[n] = k;
    itens[k] = o.v.map(cst4);
    if (o.fixo && CUSTOS.fontes.indexOf(o.fixo) >= 0) fixos[k] = o.fixo;
  });
  /* grupos da guia Agrupamento, limpos de item que nao existe mais */
  const grupos = {};
  Object.keys(CST_GRUPOS).forEach(ref=>{
    if (!itens[ref]) return;          /* a referencia precisa ter custo */
    const mem = (CST_GRUPOS[ref] || []).filter(m=>m && m !== ref);
    if (mem.length) grupos[ref] = mem;
  });
  return {itens, fixos, grupos, vazio, dups};
}

/* abre um .xlsx e devolve as celulas da aba pedida (ou da primeira) */
async function abasDoXlsx(f, nomePreferido){
  const files = await unzip(new Uint8Array(await f.arrayBuffer()));
  const wb = td(files['xl/workbook.xml'] || new Uint8Array());
  const rels = td(files['xl/_rels/workbook.xml.rels'] || new Uint8Array());
  const shared = files['xl/sharedStrings.xml'] ? sharedStrings(td(files['xl/sharedStrings.xml'])) : [];
  const attr = (tag, name) => {
    const m = tag.match(new RegExp('\\b'+name+'="([^"]*)"'));
    return m ? unesc(m[1]) : null;
  };
  const sheets = (wb.match(/<sheet\b[^>]*\/?>/g) || [])
    .map(tag=>({name:attr(tag,'name'), rid:attr(tag,'r:id') || attr(tag,'id')}))
    .filter(x=>x.name);
  const relMap = {};
  (rels.match(/<Relationship\b[^>]*\/?>/g) || []).forEach(tag=>{
    const id = attr(tag,'Id'), tg = attr(tag,'Target');
    if (id && tg) relMap[id] = tg;
  });
  const resolve = tg => {
    if (!tg) return null;
    const c = tg.replace(/^\//,'').replace(/^\.\//,'');
    for (const cand of [c, 'xl/'+c, c.replace(/^xl\//,'')]) if (files[cand]) return cand;
    return null;
  };
  const alvo = sheets.find(x=>norm(x.name) === norm(nomePreferido)) || sheets[0];
  const path = (alvo && resolve(relMap[alvo.rid]))
    || Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d*\.xml$/.test(k)).sort()[0];
  if (!path) throw new Error(t().impNoBase);
  return sheetRows(td(files[path]), shared);
}

/* Fonte de custo em uso. Nao e mais seletor: quem escolhe e a tela Ver
   custos, item a item. Aqui so mostramos o que esta valendo — o nome da
   fonte quando todos os itens usam a mesma, ou FONTE CUSTOMIZADA quando ha
   mais de uma em uso. Itens absorvidos por um grupo nao contam: quem manda
   e o item de referencia. */
/* ================= importar .xlsx ================= */
const td = b => new TextDecoder('utf-8').decode(b);
async function inflateRaw(bytes){
  if (typeof DecompressionStream === 'undefined') throw new Error(t().impNoZip);
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--)
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) throw new Error('zip');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let i = 0; i < n; i++){
    const nameLen = dv.getUint16(p + 28, true), extLen = dv.getUint16(p + 30, true);
    const cmtLen = dv.getUint16(p + 32, true), method = dv.getUint16(p + 10, true);
    const cSize = dv.getUint32(p + 20, true), lho = dv.getUint32(p + 42, true);
    const name = td(buf.subarray(p + 46, p + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true), lExtLen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lNameLen + lExtLen;
    const raw = buf.subarray(start, start + cSize);
    out[name] = method === 0 ? raw : await inflateRaw(raw);
    p += 46 + nameLen + extLen + cmtLen;
  }
  return out;
}
const unesc = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                    .replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,d)=>String.fromCharCode(d))
                    .replace(/&amp;/g,'&');
function sharedStrings(xml){
  const out = [];
  const si = xml.match(/<si\b[^>]*\/>|<si\b[^>]*>[\s\S]*?<\/si>/g) || [];
  si.forEach(s=>{
    let txt = '';
    (s.match(/<t[^>]*>([\s\S]*?)<\/t>/g) || []).forEach(m=>{
      txt += unesc(m.replace(/<t[^>]*>/,'').replace(/<\/t>/,''));
    });
    out.push(txt);
  });
  return out;
}
const colIdx = ref => {
  let n = 0;
  for (const ch of ref.replace(/\d+/g,'')) n = n*26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
function sheetRows(xml, shared){
  const rows = [];
  (xml.match(/<row\b[^>]*\/>|<row\b[^>]*>[\s\S]*?<\/row>/g) || []).forEach(rx=>{
    const cells = [];
    (rx.match(/<c\b[^>]*\/>|<c\b[^>]*>[\s\S]*?<\/c>/g) || []).forEach(cx=>{
      const ref = (cx.match(/ r="([A-Z]+\d+)"/) || [])[1];
      if (!ref) return;
      const type = (cx.match(/ t="([^"]+)"/) || [])[1];
      let val = null;
      if (type === 'inlineStr'){
        const m = cx.match(/<t[^>]*>([\s\S]*?)<\/t>/); val = m ? unesc(m[1]) : '';
      } else {
        const m = cx.match(/<v>([\s\S]*?)<\/v>/);
        if (m){
          if (type === 's') val = shared[+m[1]] ?? '';
          else if (type === 'str' || type === 'e') val = unesc(m[1]);
          else val = parseFloat(m[1]);
        }
      }
      cells[colIdx(ref)] = val;
    });

const serialToISO = v => {
  if (typeof v !== 'number' || !isFinite(v)) return null;
  const d = new Date(Date.UTC(1899,11,30) + v*86400000);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
