const norm = s => String(s??'').toLowerCase().replace(/[^a-z0-9]/g,'');
/* A planilha de custos tem uma aba TABELA com ID LIMPO + as colunas de
   cada fonte (COGS1, COGS2, LANDED1, LANDED2). Reconhecida pelo cabecalho,
   entra pelo mesmo botao de importar e vai para o banco. A planilha traz
   so valores: quem ja existia mantem a fonte marcada nele e item novo entra
   na fonte padrao (garantirFontes). Coluna FONTE, se vier de um arquivo
   antigo, e simplesmente ignorada. */
async function importarCustos(cells, fileName){
  const head = (cells[0] || []).map(x=>String(x==null?'':x).trim());
  if (head.findIndex(h=>norm(h)==='idlimpo') < 0) return false;
  const iId = head.findIndex(h=>norm(h)==='idlimpo');
  /* uma coluna por fonte do modelo; a planilha pode trazer so algumas.
     ESPECIAL aceita tambem a grafia em ingles. */
  const apelido = n => n === 'SPECIAL' ? 'ESPECIAL' : n;
  const col = FONTES.map(()=>-1);
  head.forEach((h,i)=>{
    const n = apelido(String(h).trim().toUpperCase().replace(/\s+/g,''));
    const j = FONTES.indexOf(n);
    if (j >= 0 && col[j] < 0) col[j] = i;
  });
  if (!col.some(i=>i >= 0)) return false;
  const fontes = FONTES.slice();
  /* coluna que a planilha NAO traz nao zera o que ja estava gravado: fica como
     estava. E o que permite manter uma planilha antiga de quatro colunas sem
     perder LANDED3 e ESPECIAL digitados na tela. */
  const antes = (CST_BASES.relatorio_nova && CST_BASES.relatorio_nova.itens) || CUSTOS.itens || {};
  const porChave = {};
  Object.keys(antes).forEach(k=>{ porChave[normSku(k)] = antes[k]; });
  const itens = {}, vistos = new Set();
  for (let i = 1; i < cells.length; i++){
    /* o ID entra como veio na planilha, com espacos e caixa preservados. Se
       duas linhas so diferem em espaco/caixa, vale a primeira. */
    const r = cells[i] || [], k = String(r[iId] == null ? '' : r[iId]).trim();
    const nk = normSku(k);
    if (!nk || vistos.has(nk)) continue;
    vistos.add(nk);
    const velho = porChave[nk] || [];
    itens[k] = col.map((j,f)=> j >= 0 ? cst4(r[j]) : cst4(velho[f]));
  }
  const n = Object.keys(itens).length;
  if (!n) return false;
  /* a planilha nao mexe em escolha: item que ja existia mantem a fonte dele,
     item novo fica sem e o garantirFontes() logo abaixo poe a padrao */
  const fixos = {};
  Object.keys(CUSTOS.fixos || {}).forEach(k=>{
    if (itens[k] && fontes.indexOf(CUSTOS.fixos[k]) >= 0) fixos[k] = CUSTOS.fixos[k];
  });
  /* A planilha NAO entra no que esta valendo: alimenta as duas bases "Nova",
     para voce conferir e aplicar cada cenario quando quiser. Agrupamento e
     marcacao de cada Nova sao preservados; item que sumiu sai no garantirFontes. */
  if (fontes.indexOf(S.custo) < 0) S.custo = fontes[0];
  const alvos = ['relatorio_nova','precos_nova'];
  alvos.forEach(cen=>{
    const b0 = CST_BASES[cen] || (CST_BASES[cen] = cenVazio());
    const pad = b0.padrao || CUSTOS.padrao || fontes[0];
    const fx = {};
    Object.keys(itens).forEach(k=>{
      const f = (b0.fixos || {})[k];
      fx[k] = fontes.indexOf(f) >= 0 ? f : pad;   /* item novo entra na padrao */
    });
    const gp = {};
    Object.keys(b0.grupos || {}).forEach(ref=>{
      if (!itens[ref]) return;
      const mem = (b0.grupos[ref] || []).filter(m=>m !== ref);
      if (mem.length) gp[ref] = mem;
    });
    CST_BASES[cen] = {fontes, itens: JSON.parse(JSON.stringify(itens)), fixos: fx,
      grupos: gp, padrao: b0.padrao || CUSTOS.padrao || fontes[0],
      arquivo: fileName, itens_origem: JSON.parse(JSON.stringify(itens))};
  });
  toast(t().custoOkNova(fileName, n));
  if (!SB_ON || !ADM){ toast(t().custoLocal); return true; }
  try{
    for (const cen of alvos){
      const b1 = CST_BASES[cen];
      await sbRpc('wgi_painel_salvar_custos',
        {p_senha: null, p_arquivo: fileName, p_fontes: fontes,
         p_itens: b1.itens, p_padrao: b1.padrao, p_fixos: b1.fixos,
         p_grupos: b1.grupos, p_cenario: cen, p_itens_origem: b1.itens_origem});
    }
    toast(t().custoSalvoNova(n));
  } catch(err){ toast(t().impErr + (err && err.message ? err.message : err), true); }
  return true;
}

/* ===== escrita de .xlsx sem biblioteca: zip "stored" + XML minimo =====
   Usado pela exportacao de vendas e pela exportacao da tabela de custos. */
let CRCT;
function crc32(u8){
  if (!CRCT){
    CRCT = new Uint32Array(256);
    for (let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; CRCT[n]=c>>>0; }
  }
  let c = 0xFFFFFFFF;
  for (let i=0;i<u8.length;i++) c = CRCT[(c^u8[i]) & 0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipStore(entries){
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  entries.forEach(e=>{
    const name = enc.encode(e.name), data = enc.encode(e.xml), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x2100,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true); cd.setUint16(10,0,true); cd.setUint16(12,0,true); cd.setUint16(14,0x2100,true);
    cd.setUint32(16,crc,true); cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true);
    cd.setUint16(28,name.length,true); cd.setUint32(42,off,true);
    central.push(new Uint8Array(cd.buffer), name);
    off += 30 + name.length + data.length;
  });
  let csize = 0; central.forEach(c=>csize += c.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,entries.length,true); eo.setUint16(10,entries.length,true);
  eo.setUint32(12,csize,true); eo.setUint32(16,off,true);
  const all = parts.concat(central, [new Uint8Array(eo.buffer)]);
  let total = 0; all.forEach(a=>total += a.length);
  const out = new Uint8Array(total); let q = 0;
  all.forEach(a=>{ out.set(a,q); q += a.length; });
  return out;
}
const xe = v => String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colLetter = n => { let s=''; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };
const dserial = iso => {
  const a = String(iso).split('-');
  return Math.round((Date.UTC(+a[0],+a[1]-1,+a[2]) - Date.UTC(1899,11,30))/86400000);
};
function sheetXml(rows, widths, extra){
  const cols = widths ? '<cols>'+widths.map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols>' : '';
  const body = rows.map((r,ri)=>{
    const cells = r.map((c,ci)=>{
      if (c === null || c === undefined || c === '') return '';
      const ref = colLetter(ci)+(ri+1);
      const st = c && c.s !== undefined ? ' s="'+c.s+'"' : '';
      const v = c && c.v !== undefined ? c.v : c;
      if (c && c.d) return '<c r="'+ref+'" s="2"><v>'+dserial(v)+'</v></c>';
      if (typeof v === 'number') return '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xe(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(ri+1)+'"'+(ri===0?' ht="30" customHeight="1"':'')+'>'+cells+'</row>';
  }).join('');
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0"'+(extra&&extra.nogrid?' showGridLines="0"':'')+'>'
    + (extra&&extra.freeze?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':'')
    + '</sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="14"/>' + cols
    + '<sheetData>'+body+'</sheetData></worksheet>';
}
